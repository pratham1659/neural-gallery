[package]
name = "neural-gallery-core"
version = "0.1.0"
description = "Encrypted zero-knowledge desktop vault core for Neural Gallery"
edition = "2021"

[lib]
name = "neural_gallery_core"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "neural-gallery"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
argon2 = { version = "0.5", features = ["alloc", "password-hash"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
subtle = "2.6"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
thiserror = "1.0"

[build-dependencies]
tauri-build = { version = "2", default-features = false , features = [] }

[dev-dependencies]
tempfile = "3.10"
