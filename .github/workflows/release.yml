name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS DMG (Apple Silicon ARM64)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci || npm install
          python -m venv .venv
          source .venv/bin/activate
          pip install -e .

      - name: Compile Native Swift Acceleration Bridge
        run: |
          chmod +x ./native/build.sh
          ./native/build.sh

      - name: Build React 19 Frontend
        run: npm run build

      - name: Build Tauri Desktop DMG
        run: |
          npx @tauri-apps/cli build --target aarch64-apple-darwin

      - name: Sign & Prepare DMG
        run: |
          chmod +x ./scripts/build_dmg.sh
          ./scripts/build_dmg.sh

      - name: Generate SHA256 Checksums
        run: |
          mkdir -p release-artifacts
          cp dist-dmg/*.dmg release-artifacts/ 2>/dev/null || true
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-artifacts/ 2>/dev/null || true
          cd release-artifacts
          shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/*.dmg
            release-artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
